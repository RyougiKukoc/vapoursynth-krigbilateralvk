name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Check sources and fetch pinned headers
        run: |
          python -X utf8 tools/check_sources.py
          python -X utf8 tools/fetch_dependencies.py --with-vapoursynth
      - name: Build
        shell: pwsh
        env:
          KRIG_MSYS_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $compilerDir = Join-Path $env:KRIG_MSYS_ROOT 'ucrt64/bin'
          $compiler = (Join-Path $compilerDir 'g++.exe').Replace('\', '/')
          $env:PATH = $compilerDir + ';' + $env:PATH
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_CXX_COMPILER=$compiler" -DVAPOURSYNTH_INCLUDE_DIR=dependencies/vapoursynth/include
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          objdump -p build/krigbilateralvk.dll | Select-String 'DLL Name:'
      - name: Package
        run: python -X utf8 tools/package_release.py --plugin build/krigbilateralvk.dll --output dist/krigbilateralvk-0.2.0-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: krigbilateralvk-windows-x86_64
          path: dist/*
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y g++ cmake ninja-build
      - name: Check sources and fetch pinned headers
        run: |
          python tools/check_sources.py
          python tools/fetch_dependencies.py --with-vapoursynth
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVAPOURSYNTH_INCLUDE_DIR=dependencies/vapoursynth/include
          cmake --build build
          nm -D --defined-only build/krigbilateralvk.so | grep VapourSynthPluginInit2
      - uses: actions/upload-artifact@v4
        with:
          name: krigbilateralvk-linux-x86_64
          path: build/krigbilateralvk.so
          if-no-files-found: error
